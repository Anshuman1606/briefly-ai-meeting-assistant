name: Briefly checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Unit and service tests
        run: python -m unittest discover -s tests -v
      - name: Python lint
        run: python -m ruff check --select E,F --ignore E501 .
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Start isolated PostgreSQL with a generated password
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess

          password = secrets.token_hex(32)
          print(f"::add-mask::{password}", flush=True)
          database_url = f"postgresql+psycopg://briefly_test:{password}@127.0.0.1:5432/briefly_test"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"TEST_DATABASE_URL={database_url}\n")
          subprocess.run([
              "docker", "run", "--detach", "--name", "briefly-ci-postgres",
              "--publish", "127.0.0.1:5432:5432",
              "--env", "POSTGRES_DB=briefly_test", "--env", "POSTGRES_USER=briefly_test",
              "--env", "POSTGRES_PASSWORD", "postgres:17",
          ], env={**os.environ, "POSTGRES_PASSWORD": password}, check=True)
          PY
      - name: PostgreSQL migrations, isolation, processing, and restart recovery
        env:
          APP_ENV: production
          AUTH_MODE: password
          # Test setup only; deployed applications keep signup disabled.
          ALLOW_SIGNUP: "true"
          BRIEFLY_EMBEDDED_WORKER: "false"
          TRANSCRIPTION_BACKEND: disabled
          MISTRAL_API_KEY: ""
          SARVAM_API_KEY: ""
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import time

          from sqlalchemy import create_engine, inspect, text
          from briefly.service import Service

          os.environ["DATABASE_URL"] = os.environ["TEST_DATABASE_URL"]

          def wait_for_database():
              engine = create_engine(os.environ["TEST_DATABASE_URL"])
              try:
                  for _ in range(45):
                      try:
                          with engine.connect() as connection:
                              connection.execute(text("SELECT 1"))
                          return
                      except Exception:
                          time.sleep(1)
                  raise RuntimeError("Test PostgreSQL did not become ready.")
              finally:
                  engine.dispose()

          wait_for_database()
          service = Service()
          assert "alembic_version" in inspect(service.engine).get_table_names()
          owner_password = "Owner!" + secrets.token_hex(20)
          other_password = "Other!" + secrets.token_hex(20)
          owner = service.register("ci-owner", "owner@example.test", owner_password, "Owner team")
          other = service.register("ci-other", "other@example.test", other_password, "Other team")
          meeting_id = service.sample_meeting(owner)
          queued_id = service.sample_meeting(owner)
          assert service.process_next()
          report = service.get_meeting(owner, meeting_id)
          assert report["status"] == "ready" and report["summary"] and report["chunks"]
          assert service.export_meeting(owner, meeting_id, "json")
          assert service.export_meeting(owner, meeting_id, "pdf").startswith(b"%PDF")
          try:
              service.get_meeting(other, meeting_id)
          except ValueError:
              pass
          else:
              raise AssertionError("Cross-workspace access was accepted.")
          assert service.list_meetings(other) == []
          service.engine.dispose()

          # Restart the database container and reconstruct the application service.
          subprocess.run(["docker", "restart", "briefly-ci-postgres"], check=True)
          wait_for_database()
          restarted = Service()
          authenticated = restarted.login("ci-owner", owner_password)
          assert restarted.get_meeting(authenticated, meeting_id)["summary"] == report["summary"]
          assert restarted.get_meeting(authenticated, queued_id)["status"] == "queued"
          assert restarted.process_next()
          assert restarted.get_meeting(authenticated, queued_id)["status"] == "ready"
          assert not restarted.process_next(), "Completed work was processed twice."
          restarted.engine.dispose()
          print("PostgreSQL migration, tenant isolation, exports, and restart recovery passed.")
          PY
      - name: Stop test database
        if: always()
        run: docker rm --force briefly-ci-postgres || true
